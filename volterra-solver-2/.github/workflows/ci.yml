New-Item -ItemType Directory -Force -Path .github\workflows | Out-Null

@'
name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: volterra-solver-2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit and crypto tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t volterra-solver:ci ./volterra-solver-2
'@ | Set-Content -Path .github\workflows\ci.yml -Encoding UTF8