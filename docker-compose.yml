version: "3.8"

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql-debian
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Express
      - MSSQL_COLLATION=SQL_Latin1_General_CP1_CI_AS
    ports:
      - "1433:1433"
    volumes:
      - sql2025_data:/var/opt/mssql
      - /media/sf_Shared/new_project/SQLServerDatabasesScripts:/container-init.d
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -Q 'SELECT 1' -C || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: ./volterra-solver-1
    container_name: http-server
    environment:
      - DB_HOST=mssql
      - DB_PORT=1433
      - DB_NAME=VolterraDB
      - DB_USER=sa
      - DB_PASSWORD=YourStrongPassword123!
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sql2025_data:

